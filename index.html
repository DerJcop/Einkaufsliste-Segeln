body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh}
button,input,textarea{font-family:inherit}
button{cursor:pointer;border:none}

.header{background:var(--card);border-bottom:2px solid var(--brd);position:sticky;top:0;z-index:100;padding:12px 14px}

.prog-wrap{margin-bottom:10px}
.prog-bar{background:var(--brd);border-radius:4px;height:7px;overflow:hidden}
.prog-fill{height:100%;background:var(--grn);transition:width .4s}
.prog-txt{font-size:11px;color:var(--mut);margin-top:3px}
.tabs{display:flex;gap:7px}
.tbtn{flex:1;padding:9px 6px;border-radius:8px;font-size:13px;font-weight:500;background:var(--brd);color:var(--mut)}
.tbtn.on{background:var(--acc);color:#fff;font-weight:700}

.share{background:#0f2540;border:1px solid var(--acc);border-radius:12px;padding:12px 14px;margin:10px 10px 0}
.share-label{font-size:13px;font-weight:700;color:#60a5fa;margin-bottom:6px}
.share-url{background:var(--brd);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--mut);word-break:break-all;margin-bottom:8px;line-height:1.4}
.copy-btn{background:var(--acc);color:#fff;padding:9px;border-radius:8px;font-size:13px;font-weight:700;width:100%}

.content{padding:10px 10px 60px;max-width:860px;margin:0 auto}

function defState(){const s={};ITEMS.forEach(it=>{s[it.id]={votes:[],buyAmount:it.rec,custom:false,done:false,note:""};});return s;}

function tmo(p,ms){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),ms))]);}
function getUri(){return location.hash.slice(1)||null;}
function setUri(id){location.hash=id;}

function estQty(rec,v){
  if(v===0)return rec;
  const c=rec.replace(/^ca\.\s*/i,"");
  const rm=c.match(/^(\d+(?:[.,]\d+)?)\s*[-–]\s*(\d+(?:[.,]\d+)?)\s*(.*)/);
  if(rm){const h=parseFloat(rm[2].replace(",","."));const u=rm[3].trim();return Math.max(1,Math.ceil(h*v/N))+(u?" "+u:"");}
  const sm=c.match(/^(\d+(?:[.,]\d+)?)\s*(.*)/);
  if(sm){const n=parseFloat(sm[1].replace(",","."));const u=sm[2].trim();return Math.max(1,Math.ceil(n*v/N))+(u?" "+u:"");}
  return rec;
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

async function createBlob(){
  const r=await tmo(fetch(API,{method:"POST",headers:{"Content-Type":"application/json","X-Master-Key":JBKEY,"X-Bin-Private":"false"},body:JSON.stringify(defState())}),8000);
  const d=await r.json();return d.metadata.id;
}
async function loadBlob(id){
  const r=await tmo(fetch(API+"/"+id+"/latest",{headers:{"X-Master-Key":JBKEY,"X-Bin-Meta":"false"}}),8000);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();
  return d.record !== undefined ? d.record : d;
}
async function saveBlob(id,d){
  await fetch(API+"/"+id,{method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":JBKEY},body:JSON.stringify(d)});
}

function schedSave(){
  if(saveTimer)clearTimeout(saveTimer);

    saving=true;renderSaveStatus();
    try{await saveBlob(getUri(),state);lastSaved=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});}catch(e){}
    saving=false;renderSaveStatus();
  },900);
}

function renderSaveStatus(){
  const el=document.getElementById("savestatus");

async function init(){

    try{
      const d=await loadBlob(id);

        setUri(newId);

      state=defState();
    } catch(e){
      show('<div class="loading" style="flex-direction:column;gap:16px;text-align:center;padding:20px"><div>⚠️ Keine Verbindung — bitte Internetverbindung prüfen</div><button onclick="init()" style="background:#3b82f6;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;border:none;cursor:pointer">🔄 Erneut versuchen</button></div>');
      return;
    }
  }
  render();
}

async function refresh(){
  saving=true;renderSaveStatus();
  try{const d=await loadBlob(getUri());state={...defState(),...d};lastSaved=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});}
  catch(e){}
  saving=false;render();
}

function toggleVote(id,c){
  const s=state[id];const has=s.votes.includes(c);
  s.votes=has?s.votes.filter(v=>v!==c):[...s.votes,c];
  if(!s.custom){const it=ITEMS.find(i=>i.id===id);s.buyAmount=estQty(it.rec,s.votes.length);}
  schedSave();render();
}
function toggleDone(id){state[id].done=!state[id].done;schedSave();render();}
function setBuy(id,val){state[id].buyAmount=val;state[id].custom=true;schedSave();}
function resetBuy(id){const it=ITEMS.find(i=>i.id===id);state[id].buyAmount=estQty(it.rec,state[id].votes.length);state[id].custom=false;schedSave();render();}
function setNote(id,val){state[id].note=val;schedSave();}
function togCat(cat){openCats.has(cat)?openCats.delete(cat):openCats.add(cat);render();}

function copyLink(){
  const url=location.href;
  if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>{const b=document.getElementById("copybtn");if(b){b.textContent="✓ Kopiert!";setTimeout(()=>b.textContent="🔗 Link kopieren",2000);}});}
  else{const t=document.createElement("textarea");t.value=url;document.body.appendChild(t);t.select();document.execCommand("copy");document.body.removeChild(t);}
}

function show(h){document.getElementById("app").innerHTML=h;}

function render(){
  const voted=ITEMS.filter(i=>state[i.id].votes.length>0);
  const noVote=ITEMS.filter(i=>state[i.id].votes.length===0);
  const kv=voted.filter(i=>i.k);
  const sdone=voted.filter(i=>state[i.id].done).length;
  const pct=voted.length?Math.round(sdone/voted.length*100):0;
  const url=esc(location.href);

  let h=`<div class="header">
    <div class="hrow">
      <div><div class="htitle">⛵ Wochentörn Einkaufsliste</div>
      <div class="hcrew">7 Tage · 9 Mann · ${CREW.join(", ")}</div></div>
      <button class="rfbtn" onclick="refresh()">🔄</button>
    </div>
    <div class="stats">
      <span style="color:var(--grn);font-weight:600">✅ ${voted.length}/${ITEMS.length} gewünscht</span>
      <span style="color:var(--red);font-weight:600">✕ ${noVote.length} keiner will</span>
      <span style="color:var(--ice);font-weight:600">❄️ ${kv.length} Kühlposten</span>
      <span id="savestatus" style="margin-left:auto;color:var(--mut);font-size:11px">${saving?"💾 …":lastSaved?"✓ "+lastSaved:""}</span>
    </div>
    ${voted.length?`<div class="prog-wrap"><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div><div class="prog-txt">Einkauf: ${sdone}/${voted.length} erledigt (${pct}%)</div></div>`:""}
    <div class="tabs">
      <button class="tbtn ${tab==="vote"?"on":""}" onclick="tab='vote';render()">🗳️ Abstimmung</button>
      <button class="tbtn ${tab==="shop"?"on":""}" onclick="tab='shop';render()">🛒 Einkaufen (${voted.length})</button>
    </div>
  </div>
  <div style="padding:10px 10px 0">
    <div class="share">
      <div class="share-label">🔗 Link für die Crew — einfach teilen</div>
      <div class="share-url">${url}</div>
      <button class="copy-btn" id="copybtn" onclick="copyLink()">🔗 Link kopieren</button>
    </div>
  </div>
  <div class="content">`;

  if(tab==="vote"){
    h+=`<div class="frow">
      <button class="fbtn ${filter==="all"?"on":""}" onclick="filter='all';render()">Alle (${ITEMS.length})</button>
      <button class="fbtn ${filter==="wanted"?"on":""}" onclick="filter='wanted';render()">✓ Gewünscht (${voted.length})</button>
      <button class="fbtn ${filter==="unwanted"?"on":""}" onclick="filter='unwanted';render()">✕ Keiner will (${noVote.length})</button>
    </div>`;

    CATS.forEach(cat=>{
      let items=ITEMS.filter(i=>i.cat===cat);
      if(filter==="wanted")items=items.filter(i=>state[i.id].votes.length>0);
      if(filter==="unwanted")items=items.filter(i=>state[i.id].votes.length===0);
      if(!items.length)return;
      const isOpen=openCats.has(cat);
      const wn=items.filter(i=>state[i.id].votes.length>0).length;
      h+=`<div class="cblock">
        <div class="chdr" onclick="togCat('${esc(cat)}')">
          <span class="ctitle">${esc(cat)}</span>
          <div style="display:flex;gap:10px;align-items:center"><span class="ccnt">${wn}/${items.length}</span><span style="color:var(--mut)">${isOpen?"▲":"▼"}</span></div>
        </div>`;
      if(isOpen){
        items.forEach((item,idx)=>{
          const s=state[item.id];const vn=s.votes.length;
          const it=ITEMS.find(i=>i.id===item.id);
          const ae=estQty(it.rec,vn);const canScale=ae!==it.rec;
          const bg=s.done?"var(--don)":vn===0?"var(--dim)":idx%2===0?"var(--r0)":"var(--r1)";
          const op=vn===0&&!s.done?".55":s.done?".65":"1";
          let dots="<div class='vdots'>";
          for(let i=0;i<N;i++)dots+=`<div class="vdot${i<vn?(vn===N?" ff":" f"):""}"></div>`;
          dots+="</div>";
          const vcol=vn===0?"var(--red)":vn===N?"var(--grn)":"var(--ylw)";
          let chips="<div class='chips'>";
          CREW.forEach(c=>{const on=s.votes.includes(c);chips+=`<button class="chip ${on?"on":""}" onclick="toggleVote('${item.id}','${esc(c)}')">${esc(c)}</button>`;});
          chips+="</div>";
          h+=`<div class="item" style="background:${bg};opacity:${op}">
            <div class="ihdr">
              <div>
                <div class="iname${vn===0?" dim":""}${s.done?" struck":""}">${esc(item.name)}${item.k?" ❄️":""}</div>
                <div class="irec">Empfohlen: ${esc(it.rec)}</div>
              </div>
              <label class="dlbl"><input type="checkbox"${s.done?" checked":""} onchange="toggleDone('${item.id}')"><span class="${s.done?"done":""}">${s.done?"✓ Erledigt":"Erledigt"}</span></label>
            </div>
            <div class="vbar">${dots}<span class="vcnt" style="color:${vcol}">${vn}/${N}</span></div>
            ${chips}
            ${vn>0?`<div class="qsec">
              <div class="qlbl">Zu kaufen${canScale?` <span class="qhint">· auto-skaliert ${vn}/${N} Stimmen</span>`:""}${s.custom?` <button class="qreset" onclick="resetBuy('${item.id}')">↺ Reset</button>`:""}</div>
              <input class="qinput" value="${esc(s.buyAmount)}" oninput="setBuy('${item.id}',this.value)">
            </div>`:""}
            <div>
              <div class="nlbl">📝 Notiz (für alle sichtbar)</div>
              <textarea class="ntxt" rows="2" placeholder="z.B. weiß oder rot? · wer bringt mit? · Marke beachten ..." oninput="setNote('${item.id}',this.value)">${esc(s.note)}</textarea>
            </div>
          </div>`;
        });
      }
      h+="</div>";
    });

  } else {
    if(!voted.length){
      h+=`<div style="text-align:center;padding:60px 20px;color:var(--mut)"><div style="font-size:36px;margin-bottom:12px">🗳️</div><div style="font-size:16px;font-weight:600;color:var(--txt)">Noch keine Abstimmungen</div><div style="font-size:13px;margin-top:6px">Im Abstimmungs-Tab Namenskürzel eintragen!</div></div>`;
    } else {
      if(kv.length){h+=`<div class="bnnr bnnr-b"><div class="btitle">❄️ ${kv.length} Kühlschrankposten — Platz einplanen!</div><div class="bitems">${kv.map(i=>esc(i.name)).join(" · ")}</div></div>`;}
      if(noVote.length){h+=`<div class="bnnr bnnr-r"><div class="btitle">✕ ${noVote.length} Artikel — niemand gewählt, nicht kaufen</div><div class="bitems">${noVote.map(i=>esc(i.name)).join(" · ")}</div></div>`;}
      CATS.forEach(cat=>{
        const items=ITEMS.filter(i=>i.cat===cat&&state[i.id].votes.length>0);
        if(!items.length)return;
        const cd=items.filter(i=>state[i.id].done).length;
        h+=`<div class="cblock"><div class="chdr" style="cursor:default"><span class="ctitle">${esc(cat)}</span><span style="font-size:12px;color:${cd===items.length?"var(--grn)":"var(--mut)"}">${cd}/${items.length} ✓</span></div>`;
        items.forEach((item,idx)=>{
          const s=state[item.id];const bg=s.done?"var(--don)":idx%2===0?"var(--r0)":"var(--r1)";
          h+=`<div class="shopitem" style="background:${bg};opacity:${s.done?.5:1}">
            <input type="checkbox" class="shopchk"${s.done?" checked":""} onchange="toggleDone('${item.id}')">
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap">
                <span class="shopname${s.done?" struck":""}">${esc(item.name)}${item.k?" ❄️":""}</span>
              </div>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                <span class="shopqty">${esc(s.buyAmount)}</span>
                <span class="shopvotes">${s.votes.length}/${N} Stimmen</span>
              </div>
              ${s.note?`<div class="notecall">📝 ${esc(s.note)}</div>`:""}
            </div>
          </div>`;
        });
        h+="</div>";
      });
    }
  }

  h+=`</div><div class="footer">Alle Änderungen für die ganze Crew gespeichert · 🔄 für neuesten Stand</div>`;
  show(h);
}

init();
</script>
</body>
</html>
